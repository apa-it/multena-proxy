name: Edge Image

# Rolling "edge" build for main: pushes a mutable `main` tag (plus the
# immutable commit SHA) to ghcr.io on every push to main. This is
# intentionally separate from release.yml's gated push job, which only
# publishes on a `v*` tag or an explicit workflow_dispatch - a plain push to
# main never reaches that job. There is no pull_request trigger here: PR
# branches (including forks) never get an unreviewed publish, exactly the
# risk that was removed in PR #21.
on:
  push:
    branches: [ main ]

env:
  GO_VERSION: '1.27.4'

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go get .

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-X main.Commit=$(git rev-parse HEAD)" -o . -v ./...

      - name: Set image name
        run: echo "IMAGE_ID=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_ID }}
          tags: |
            type=raw,value=main
            type=raw,value=${{ github.sha }}

      - name: Buildah Action
        id: build-image
        uses: redhat-actions/buildah-build@9dc2ade9b5db229966b5025ae266311e12f349c4 # v2
        with:
          image: ${{ env.IMAGE_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: |
            ./build/Containerfile

      - name: push image to trivy
        run: |
          buildah push ${{ steps.build-image.outputs.image-with-tag }} oci:./multena-proxy-oci

      - name: Run Trivy vulnerability scanner (severity gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: 'multena-proxy-oci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (SARIF upload)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: 'multena-proxy-oci'
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-edge'

      - name: Log in to the GitHub Container registry
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Repository
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@5860fc963bf8f2b3221773a023141612f010c469 # v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io

name: Chart CI

on:
  pull_request:
    paths:
      - 'charts/**'

env:
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7
  # Custom resources that need a cluster/operator CRD not present in a bare
  # kind cluster (Prometheus Operator, External Secrets Operator, Grafana
  # Operator, Kyverno). Rendering (helm template) works fine without them;
  # only CRD-aware schema validation needs to skip these kinds explicitly.
  CRD_SKIP_KINDS: ServiceMonitor,ExternalSecret,GrafanaDatasource,ClusterPolicy

jobs:
  lint-and-render:
    name: lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python (for ct)
        uses: actions/setup-python@v5
        with:
          # Pinned below 3.12: yamale (used by ct lint's schema validation)
          # still references ast.Num/ast.Str, which were removed in Python 3.12.
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run ct lint
        run: |
          ct lint \
            --target-branch main \
            --charts charts/multena-proxy \
            --validate-maintainers=false \
            --lint-conf .github/ct-lintconf.yaml

      - name: helm lint
        run: helm lint charts/multena-proxy

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render tests - switch matrix
        run: |
          set -euo pipefail
          SKIP="${CRD_SKIP_KINDS}"

          render() {
            local name="$1"; shift
            echo "--- render: ${name} (set: $*) ---"
            helm template charts/multena-proxy "$@" | kubeconform -strict -summary -skip "${SKIP}"
          }

          render "defaults"
          render "db.enabled" --set proxy.web.labelStoreKind=mysql --set proxy.db.enabled=true
          render "collector.enabled=false" --set collector.enabled=false
          render "collector.enabled=true" --set collector.enabled=true
          render "tls.loki+thanos enabled" --set tls.loki.enabled=true --set tls.thanos.enabled=true
          render "tls.loki+thanos disabled" --set tls.loki.enabled=false --set tls.thanos.enabled=false
          render "alert.enabled" --set proxy.alert.enabled=true

      - name: Render test - digest pinning
        run: |
          set -euo pipefail
          DIGEST="sha256:1111111111111111111111111111111111111111111111111111111111111111"
          OUT="$(helm template charts/multena-proxy --set image.digest=${DIGEST})"
          echo "${OUT}" | kubeconform -strict -summary -skip "${CRD_SKIP_KINDS}"
          echo "${OUT}" | grep -F "ghcr.io/apa-it/multena-proxy@${DIGEST}"

      - name: Render test - image.registry override (pull-through mirror)
        run: |
          set -euo pipefail
          MIRROR="mirror.example.test"
          # Default render must keep the ghcr.io references unchanged.
          DEF="$(helm template charts/multena-proxy --set collector.enabled=true)"
          echo "${DEF}" | grep -F "image: \"ghcr.io/apa-it/multena-proxy:"
          echo "${DEF}" | grep -F "image: ghcr.io/gepaplexx/multena-rbac-collector:"
          # Registry override replaces the host for both images.
          OUT="$(helm template charts/multena-proxy --set collector.enabled=true \
            --set image.registry=${MIRROR} --set collector.image.registry=${MIRROR})"
          echo "${OUT}" | kubeconform -strict -summary -skip "${CRD_SKIP_KINDS}"
          echo "${OUT}" | grep -F "image: \"${MIRROR}/apa-it/multena-proxy:"
          echo "${OUT}" | grep -F "image: ${MIRROR}/gepaplexx/multena-rbac-collector:"
          # Full host baked into repository/name must not get the registry prepended.
          FULL="$(helm template charts/multena-proxy --set collector.enabled=true \
            --set image.repository=${MIRROR}/apa-it/multena-proxy \
            --set collector.image.name=${MIRROR}/gepaplexx/multena-rbac-collector)"
          echo "${FULL}" | grep -F "image: \"${MIRROR}/apa-it/multena-proxy:"
          echo "${FULL}" | grep -F "image: ${MIRROR}/gepaplexx/multena-rbac-collector:"
          if echo "${FULL}" | grep -F "ghcr.io/"; then
            echo "Default registry was prepended to a repository that already contains a host." >&2
            exit 1
          fi

      - name: Guard against foreign production hostnames in defaults
        run: |
          set -euo pipefail
          # Only look at actual http(s):// URLs, not label keys like
          # "monitoring.gepardec.com/system" which are naming conventions,
          # not network endpoints.
          if helm template charts/multena-proxy \
              | grep -Eio 'https?://[^"'"'"' ]+' \
              | grep -Ei 'gepardec\.com|gepaplexx\.com|play\.run\.' ; then
            echo "Found a foreign production hostname in the default chart render." >&2
            exit 1
          fi
          echo "No foreign production hostnames found in the default render."

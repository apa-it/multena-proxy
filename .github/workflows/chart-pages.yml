name: Chart Release (Pages)

# Builds the Helm chart repository index for GitHub Pages (Actions build
# type, see Settings -> Pages -> Source: GitHub Actions). This workflow does
# NOT use helm/chart-releaser-action, because that action pushes to a
# gh-pages branch, which does not match this repo's Pages source mode.
#
# Only runs on an explicit release tag or a manual dispatch. It never
# triggers on a plain push to main, so merging a chart version bump alone
# does not publish anything.
#
# A single vX.Y.Z tag drives both this workflow and release.yml's image
# publish: the app version (appVersion) and the Helm chart version
# (version) are versioned together and derived from the same tag.
on:
  push:
    tags:
      # Release tags, e.g. v0.8.0. Same schema as release.yml.
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart/app version to publish (e.g. v0.8.0). Required for a manual release.'
        required: true

permissions:
  contents: read

# NOTE on `contents: write` below: this repo documents a rule of "no
# automatic releases without human sign-off" elsewhere (release.yml /
# next-version.yml are dry-run only). That rule targets *unattended*
# releases triggered by CI on every merge. It does not apply here: this
# workflow only runs on a `v*` tag that a human already pushed (or an
# explicit workflow_dispatch), so the release itself is human-gated;
# `contents: write` here is solely to attach/publish the already-built
# chart .tgz as an asset on that existing tag's release, which is the
# permanent storage GitHub Pages' deploy-pages overwrite cannot provide.

# Serialize chart releases: two deploys racing would both read the
# published index.yaml and one would overwrite the other's --merge result.
concurrency:
  group: chart-pages
  cancel-in-progress: false

env:
  HELM_VERSION: v3.16.4
  PAGES_URL: https://apa-it.github.io/multena-proxy/
  CHART_DIR: charts/multena-proxy

jobs:
  build:
    name: package + index
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      chart_version: ${{ steps.chart-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Determine release version
        id: tag_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '$version' does not match the required vX.Y.Z schema (no build metadata)." >&2
            exit 1
          fi
          echo "new_tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Set chart version and appVersion from tag
        run: |
          # Strip the leading 'v' - Chart.yaml's version/appVersion are plain
          # semver, the git tag carries the 'v' prefix.
          semver="${{ steps.tag_version.outputs.new_tag }}"
          semver="${semver#v}"
          sed -i -E "s/^version: .*/version: ${semver}/" "${{ env.CHART_DIR }}/Chart.yaml"
          sed -i -E "s/^appVersion: .*/appVersion: \"${semver}\"/" "${{ env.CHART_DIR }}/Chart.yaml"

      - name: Read chart version
        id: chart-version
        run: |
          version=$(helm show chart "${{ env.CHART_DIR }}" | awk -F': ' '/^version:/ {print $2}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "${{ env.CHART_DIR }}" -d dist

      - name: Publish chart as GitHub Release asset
        # Pages' deploy-pages step below replaces the ENTIRE Pages content
        # on every run, so .tgz files packaged in earlier runs don't
        # survive on Pages. GitHub Release assets are not touched by
        # deploy-pages and persist per tag, so they are the permanent
        # home for the chart binaries; Pages only ever serves index.yaml
        # (+ index.html), which points at these release URLs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "${{ github.repository }}" --title "$TAG" --generate-notes
          gh release upload "$TAG" "dist/multena-proxy-${{ steps.chart-version.outputs.version }}.tgz" \
            -R "${{ github.repository }}" --clobber

      - name: Fetch existing index.yaml (if published)
        run: |
          # First-ever release has nothing to merge against; that is fine.
          curl -fsSL "${{ env.PAGES_URL }}index.yaml" -o old-index.yaml \
            || echo "No published index.yaml yet (first release) - skipping merge base."

      - name: Build index (merge with existing entries)
        run: |
          # Only this run's new version gets indexed here, so a single
          # --url pointing at the release asset base is correct for it.
          # Older entries keep whatever URL they already carried in
          # old-index.yaml - helm's --merge never rewrites existing
          # entries, it only adds new ones.
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_version.outputs.new_tag }}/"
          if [ -f old-index.yaml ]; then
            helm repo index dist --url "$RELEASE_URL" --merge old-index.yaml
          else
            helm repo index dist --url "$RELEASE_URL"
          fi

      - name: Build landing page (index.html)
        run: |
          sed "s/__CHART_VERSION__/${{ steps.chart-version.outputs.version }}/g" \
            docs/pages-index.html > dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

---
# yamllint config used by `ct lint` (helm/chart-testing) for charts/**.
# Relaxes a couple of purely stylistic rules so we don't have to reformat
# every inline comment in the vendored upstream chart; structural/schema
# problems are still caught by helm lint, ct lint's chart validation and
# the render tests.
extends: default

rules:
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  line-length: disable
  truthy: disable

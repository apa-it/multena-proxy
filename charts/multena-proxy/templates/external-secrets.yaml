{{- if and (eq .Values.proxy.web.labelStoreKind "mysql") (not .Values.proxy.db.existingSecret) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "multena-proxy.name" . }}-db-external-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multena-proxy.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: admin-internal-cluster-store
  target:
    name: {{ include "multena-proxy.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.proxy.db.tokenKey }}
        version: "latest"
        property: "password"
{{ end }}